<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<!-- Content-Security-Policy, delivered by meta because GitHub Pages cannot
     set response headers. script-src carries no 'unsafe-inline' and no
     'unsafe-eval': the site has zero inline event handlers and zero eval /
     new Function / string timers, so every inline script is covered by a
     sha256 hash instead. style-src DOES need 'unsafe-inline' — there are 19
     inline <style> blocks and 10 style="" attributes, and an attribute cannot
     be hashed. img-src allows the GoatCounter host because count.v4.js falls
     back to an image beacon on browsers without sendBeacon; connect-src allows
     it for sendBeacon itself, and formsubmit.co for the feedback form.
     frame-ancestors is deliberately absent: it is IGNORED in a meta CSP, so
     clickjacking protection would need a real header Pages cannot send.
     If an inline script changes, its hash must be recomputed or it is blocked. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-rpq8+21DRUFTpqyH5VcTMDbs2QkltB+KJQIAURL6Wh4=' https://gc.zgo.at 'sha256-dkw7ue2v0iftJkGPEwjqUvmxSwYbgf9sg0hcZJagIGI=' 'sha256-x2jk2aH69OCFs7cEGOQA38pNq+gaiPwu/kQ6nlZw6vM=' 'sha256-nFhEJjnfy9TxLTFUJW8bFb3eNE/wxupfsBJ4rABvE60=' 'sha256-iN3Pxc5eyqpacl1/owi9cfPKxeNl79RhA0xNSKa8cIo='; style-src 'self' 'unsafe-inline'; img-src 'self' https://lyvorianstudio.goatcounter.com; font-src 'self'; connect-src 'self' https://formsubmit.co https://lyvorianstudio.goatcounter.com; manifest-src 'self'; worker-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'"/>
<!-- Clickjacking defence. The right tool is frame-ancestors, but it is IGNORED
     in a meta CSP and GitHub Pages cannot send response headers, so this is the
     available fallback.
     Hide-by-default, not just a redirect: a plain "break out of the frame"
     buster is defeated by <iframe sandbox>, which blocks the navigation. Here
     the document starts display:none and only reveals itself once it confirms
     it is the top window, so a sandboxed frame gets a blank page instead.
     <noscript> restores it for anyone browsing without JavaScript, who cannot
     be clickjacked into a scripted overlay anyway. -->
<style>html{display:none}</style>
<script>if(self===top){document.documentElement.style.display='block'}else{top.location=self.location}</script>
<noscript><style>html{display:block}</style></noscript>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Moved — Privacy Policy | Lyvorian Studio</title>
<!--
  The app formerly called Kidomira is now Medhakeli. This page existed at a
  public URL, so it redirects rather than 404s — a privacy policy URL is the
  kind of link that ends up in a store listing or someone's notes, and a dead
  one is worse than a stale one.

  `noindex` plus the canonical tag point search engines at the new page without
  leaving two competing copies of the same policy in the index.
-->
<meta name="robots" content="noindex,follow"/>
<link rel="canonical" href="https://lyvorianstudio.co.in/privacy-medhakeli.html"/>
<meta http-equiv="refresh" content="0; url=privacy-medhakeli.html"/>
<script>location.replace('privacy-medhakeli.html' + location.hash);</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;
       font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;
       background:#f2e8d5;color:#2b241c;padding:24px;text-align:center}
  a{color:#8a5a2b}
  @media (prefers-color-scheme:dark){body{background:#191410;color:#e8e0d4}a{color:#d9a86a}}
</style>
</head>
<body>
  <main>
    <h1>This page has moved</h1>
    <p>Kidomira is now called <strong>Medhakeli</strong>.</p>
    <p><a href="privacy-medhakeli.html">Read the Medhakeli privacy policy &rarr;</a></p>
  </main>
</body>
</html>
